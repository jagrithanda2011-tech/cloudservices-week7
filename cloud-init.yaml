#cloud-config
package_update: true

packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Cloud Services Week 7</title>
      </head>
      <body style="font-family:Arial;text-align:center;padding:60px">
        <h1>${student_name}</h1>
        <h2>${page_message}</h2>
        <p>Deployed automatically using OpenTofu and cloud-init.</p>
      </body>
      </html>

runcmd:
  - systemctl enable --now apache2